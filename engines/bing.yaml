# Bing web search (W1-03). `first` is 1-based and steps by `page_size`
# (page 2 -> first=11), hence `{offset+1}`. `mkt` resolves via
# `request.market` (issue #110): a market must always be sent — verified
# live 2026-09-22, without one Bing serves a syntactically valid SERP
# whose organic results belong to a different query (low-trust IP
# geolocation poisoning). Unmapped langs fall back to `default: en-US`.
# `{lang}` still flows via Accept-Language.
id: bing
tier: 1
page_size: 10
request:
  url: "https://www.bing.com/search?q={q}&first={offset+1}&mkt={market}"
  headers:
    Accept-Language: "{lang}"
  timeout_ms: 8000
  # lang -> Bing `mkt` market code; `default` is the fallback (en-US,
  # the broadest English market).
  market:
    en: en-US
    en-GB: en-GB
    fr: fr-FR
    de: de-DE
    es: es-ES
    it: it-IT
    pt: pt-BR
    nl: nl-NL
    sv: sv-SE
    ru: ru-RU
    ja: ja-JP
    ko: ko-KR
    zh: zh-CN
    # Script-qualified Traditional tags must reach a Traditional market
    # before the generic `zh` key (mainland) does.
    zh-Hant: zh-TW
    zh-Hant-HK: zh-HK
    zh-TW: zh-TW
    zh-HK: zh-HK
    default: en-US
parse:
  kind: html
  results: "li.b_algo"
  fields:
    title: { css: "h2 a", text: true }
    url: { css: "h2 a", attr: href }
    snippet: { css: [".b_caption p", "p"], text: true }
detect:
  blocked: ["captcha", "unusual traffic"]
  rate_limited_status: [429]
unwrap_redirect:
  # https://www.bing.com/ck/a?...&u=a1<base64url(target)>&ntb=1
  - match: "bing.com/ck/a"
    param: u
    strip: "a1"
    base64: true
