# Bing web search (W1-03). `first` is 1-based and steps by `page_size`
# (page 2 -> first=11), hence `{offset+1}`. `mkt` is pinned to en-US:
# verified live 2026-09-22, without a market Bing serves a syntactically
# valid SERP whose organic results belong to a different query
# (low-trust IP poisoning). `{lang}` still flows via Accept-Language.
id: bing
tier: 1
page_size: 10
request:
  url: "https://www.bing.com/search?q={q}&first={offset+1}&mkt=en-US"
  headers:
    Accept-Language: "{lang}"
  timeout_ms: 8000
parse:
  kind: html
  results: "li.b_algo"
  fields:
    title: { css: "h2 a", text: true }
    url: { css: "h2 a", attr: href }
    snippet: { css: [".b_caption p", "p"], text: true }
detect:
  blocked: ["captcha", "unusual traffic"]
  rate_limited_status: [429]
unwrap_redirect:
  # https://www.bing.com/ck/a?...&u=a1<base64url(target)>&ntb=1
  - match: "bing.com/ck/a"
    param: u
    strip: "a1"
    base64: true
