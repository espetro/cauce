<article class="result" data-result-id="${rid}">
  <div class="r-head"><img class="fav" src="${fav}" width="16" height="16" loading="lazy" alt="" onerror="this.style.display='none'"><span class="domain">${domain}</span></div>
  <h3 class="r-title"><a class="link" rel="noopener noreferrer" target="_blank" href="${url}" data-result-url="${url_attr}" data-result-title="${title_attr}" data-result-id="${rid_attr}" data-query-hash="${qh}">${title}</a></h3>
  ${snippet_html}
  ${preview_html}
</article>
