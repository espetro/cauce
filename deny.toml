# cargo-deny configuration.
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Repository licensing (wave-0 plan, settled inputs):
#   crates/*  -> MPL-2.0
#   engines/, sdk/ -> Apache-2.0
# Third-party dependencies are restricted to the allowlist below.

[graph]
all-features = false

[advisories]
# Defaults: check the RustSec advisory database.
ignore = []

[bans]
# Defaults. No duplicate-version or crate bans yet.
deny = []
skip = []

[licenses]
# SPDX identifiers permitted for third-party dependencies. cargo-deny >= 0.19
# removed the separate deny/copyleft/unlicensed keys (PR #611): anything not in
# `allow` is denied, so the entire GPL/AGPL/LGPL family is excluded by not
# being listed here.
allow = [
    "MPL-2.0",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []
