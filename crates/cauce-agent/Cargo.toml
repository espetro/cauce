[package]
name = "cauce-agent"
description = "The grounded-answer agent loop — turn orchestration, tool registry + dispatch, termination. The harness seam: provider/tool/observer traits in, AnswerFrame stream out. No HTTP, no SSE."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
cauce-core = { path = "../cauce-core" }
serde_json = "1"
# tokio::spawn per run (rt) and the unbounded frame channel (sync).
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
url = "2"
