[package]
name = "oxe-server"
description = "axum router, HTMX templates, SSE, MCP, Exa adapter, static assets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["otlp"]
# OTLP trace export via tracing-opentelemetry. Active only when
# OTEL_EXPORTER_OTLP_ENDPOINT is set at runtime; the feature only controls
# whether the code is compiled in.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
oxe-core = { path = "../oxe-core" }
askama = "0.13"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# axum::serve + graceful-shutdown signals; the optional OTLP layer relies on
# the multi-thread runtime feature set too.
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
# Same major version as oxe-core: `Config::raw_tree_mut` hands out a
# `toml::Value` and the types must be identical across the crates.
toml = { version = "0.9", features = ["preserve_order"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v7", "serde"] }

opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
# default-features off: the default set pulls the HTTP/proto + reqwest
# exporters; we only ship the gRPC/tonic span exporter.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[dev-dependencies]
async-trait = "0.1"
oxe-engines = { path = "../oxe-engines" }
oxe-store-sqlite = { path = "../oxe-store-sqlite" }
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
