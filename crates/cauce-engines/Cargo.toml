[package]
name = "cauce-engines"
description = "Engine runtimes: declarative, exec, replay."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
# Tracking-redirect unwrapping (declarative): bing `u=a1<base64>` payloads.
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
# `engines/*.yaml` embedded into the binary (declarative spec loading);
# `include-exclude` keeps `engines/fixtures/` bodies out of the binary.
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
cauce-core = { path = "../cauce-core" }
# Tracking-redirect unwrapping (declarative): yahoo `/RU=<encoded>` paths.
percent-encoding = "2.3.2"
# `parse.fields.*.regex` post-extraction filter (declarative).
regex = "1.13.1"
# HeaderMap/HeaderName/HeaderValue for spec `request.headers`; features
# unified with cauce-core's rustls-enabled reqwest.
reqwest = { version = "0.13.5", default-features = false }
# HTML result extraction via compiled CSS selectors (declarative).
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `parse.kind: json` field extraction (declarative).
serde_json_path = "0.7.2"
# YAML engine specs; maintained drop-in fork of serde_yaml.
serde_norway = "0.9.42"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
wiremock = "0.6"
