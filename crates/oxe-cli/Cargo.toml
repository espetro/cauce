[package]
name = "oxe-cli"
description = "oxe binary: serve, search, engine test, cache, record."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[bin]]
name = "oxe"
path = "src/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

# The binary's feature surface mirrors oxe-server's (W1-12): defaults are
# `ui mcp ai`. `cargo build -p oxe-cli --no-default-features --features mcp`
# produces the minimal agent build (`oxe mcp` + headless `oxe serve`, no
# templates/assets, no OTLP); `mise run validate` keeps it compiling.
[features]
default = ["ui", "mcp", "ai"]
ui = ["oxe-server/ui"]
mcp = ["oxe-server/mcp"]
ai = ["oxe-server/ai"]
archive = ["oxe-server/archive"]
semantic = ["oxe-server/semantic"]
postgres = ["oxe-server/postgres"]
otlp = ["oxe-server/otlp"]

[dependencies]
oxe-core = { path = "../oxe-core" }
oxe-engines = { path = "../oxe-engines" }
oxe-server = { path = "../oxe-server", default-features = false }
oxe-store-sqlite = { path = "../oxe-store-sqlite" }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }
tempfile = "3"
# rmcp client side for the `oxe mcp` stdio e2e test (feature-unified with
# the rmcp that oxe-server depends on).
rmcp = { version = "3", features = ["client", "transport-async-rw"] }
uuid = { version = "1", features = ["v7"] }
