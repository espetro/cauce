[package]
name = "oxe-cli"
description = "oxe binary: serve, search, engine test, cache, record."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[bin]]
name = "oxe"
path = "src/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[features]
default = []
# Opt-in OTLP trace export (`cargo install --features otlp`); non-default
# per the wave-1 settled inputs. Feature wiring grows with W1-12.
otlp = ["oxe-server/otlp"]

[dependencies]
oxe-core = { path = "../oxe-core" }
oxe-engines = { path = "../oxe-engines" }
oxe-server = { path = "../oxe-server" }
oxe-store-sqlite = { path = "../oxe-store-sqlite" }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }
serde_json = "1"
tempfile = "3"
