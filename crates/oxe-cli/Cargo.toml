[package]
name = "oxe-cli"
description = "oxe binary: serve, search, engine test, cache, record."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oxe"
path = "src/main.rs"

[dependencies]
oxe-core = { path = "../oxe-core" }
oxe-engines = { path = "../oxe-engines" }
tokio = { version = "1", features = ["rt"] }
