[package]
name = "cauce-store-sqlite"
description = "rusqlite implementation of the cauce Store trait (bundled, fts5)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
chrono = "0.4"
cauce-core = { path = "../cauce-core" }
# `bundled` builds the vendored libsqlite3-sys amalgamation, which compiles
# FTS5 in by default (rusqlite >= 0.40 has no separate `fts5` feature; the
# default `ffi-sqlite-wasm-rs` backend is disabled in favour of `bundled`).
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
url = "2"
uuid = "1"

[dev-dependencies]
cauce-core = { path = "../cauce-core", features = ["conformance"] }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
