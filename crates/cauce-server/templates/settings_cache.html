<fieldset id="cache-block">
  <legend>{{ crate::i18n::tr("settings.section_cache") }}</legend>
  <p class="hint">{{ line }}</p>
  <p class="cache-actions">
    <button type="button"
            hx-delete="/api/cache?expired=true"
            hx-params="none"
            hx-headers='{"X-Cauce-Client":"ui"}'
            hx-confirm="{{ crate::i18n::tr("settings.confirm_expired") }}"
            hx-on::after-request="if(event.detail.successful)htmx.ajax('GET','/settings?fragment=cache',{target:'#cache-block',swap:'outerHTML'})">{{ crate::i18n::tr("settings.delete_expired") }}</button>
    <button type="button"
            hx-delete="/api/cache?all=true"
            hx-params="none"
            hx-headers='{"X-Cauce-Client":"ui"}'
            hx-confirm="{{ crate::i18n::tr("settings.confirm_all") }}"
            hx-on::after-request="if(event.detail.successful)htmx.ajax('GET','/settings?fragment=cache',{target:'#cache-block',swap:'outerHTML'})">{{ crate::i18n::tr("settings.delete_all") }}</button>
    <a href="/cache">{{ crate::i18n::tr("settings.browse_entries") }}</a>
  </p>
</fieldset>
