[package]
name = "cauce-server"
description = "axum router, HTMX templates, SSE, MCP, Exa adapter, static assets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Cargo features (parent plan "Modes and budgets", W1-12): `ui`, `mcp` and
# `ai` are the default set; `otlp` is non-default so tonic/prost stay out of
# the default build. `archive`, `semantic` and `postgres` are declared for
# the later waves that land their modules (`requires` rows in `ROUTES`
# already name them); today they gate nothing.
[features]
default = ["ui", "mcp", "ai"]
# HTMX pages and embedded static assets (html.rs, askama templates).
# `cauce serve --headless` can drop them at runtime; building without `ui`
# drops them (and askama/rust-embed) at compile time.
ui = ["dep:askama", "dep:rust-embed", "dep:urlencoding", "dep:reqwest"]
# MCP surfaces: the `/mcp` streamable-HTTP endpoint and `cauce mcp`'s stdio
# transport (mcp.rs). schemars backs the tool arg schemas.
mcp = ["dep:rmcp", "dep:schemars"]
# AI answer pipeline (wave 4 `/api/answer`); no modules yet.
ai = []
# Page archive / fetch-and-index (wave 5 `/api/pages`, `/api/archive`); no
# modules yet.
archive = []
# Semantic/vector search; no modules yet.
semantic = []
# Postgres Store impl (wave 6); no modules yet.
postgres = []
# OTLP export (spans via tracing-opentelemetry). Non-default per the amended
# W1-09 contract; active only when OTEL_EXPORTER_OTLP_ENDPOINT is set at
# runtime — the feature only controls whether the code is compiled in.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
cauce-core = { path = "../cauce-core" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# axum::serve + graceful-shutdown signals; the optional OTLP layer relies on
# the multi-thread runtime feature set too.
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
# Same major version as cauce-core: `Config::from_raw`/`raw_tree` hand out a
# `toml::Value` and the types must be identical across the crates.
toml = { version = "0.9", features = ["preserve_order"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }

# `ui` feature: HTMX templates and embedded static assets.
askama = { version = "0.13", optional = true }
rust-embed = { version = "8", optional = true }
urlencoding = { version = "2", optional = true }
# reqwest is used only for its header types in the /settings `/models`
# listing (the client itself is cauce-core's `HttpClient`); features unify
# with cauce-core's entry (rustls `default-tls`).
reqwest = { version = "0.13.5", default-features = false, optional = true }

# OTLP trace export (observability/otlp.rs), all gated behind the
# non-default `otlp` feature. `default-features` off on the exporter: its
# default set pulls the HTTP/proto + reqwest exporters; we only ship the
# gRPC/tonic one. W1-09 metrics need no SDK: the registry in cauce-core
# renders Prometheus text itself.
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
# `mcp` feature (W1-08): streamable HTTP at /mcp + stdio for `cauce mcp`.
# `schemars` is a direct dep because `rmcp` re-exports it and the tool arg
# structs derive `schemars::JsonSchema`.
rmcp = { version = "3", features = [
    "transport-streamable-http-server",
    "transport-io",
], optional = true }
schemars = { version = "1", optional = true }

[dev-dependencies]
async-trait = "0.1"
# Test-store seeding helpers (`conformance::request`/`response`), same as
# cauce-store-sqlite's dev-dependency.
cauce-core = { path = "../cauce-core", features = ["conformance"] }
cauce-engines = { path = "../cauce-engines" }
cauce-store-sqlite = { path = "../cauce-store-sqlite" }
# W1-09 acceptance: parse `/metrics` output with a real text parser.
prometheus-parse = "0.2"
# Boundary proptests for the pure Exa helpers (mcp/exa.rs); same pin as
# cauce-core.
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
# Replayed provider transcripts for the `POST /api/answer` route tests
# (W4-03); same pin as cauce-core's.
wiremock = "0.6"
# rmcp client side for the MCP-over-HTTP integration test (feature-unified
# with the [dependencies] entry). reqwest is the rmcp streamable client's
# HTTP backend; http-only on loopback so no TLS features are needed.
rmcp = { version = "3", features = [
    "client",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
reqwest = { version = "0.13", default-features = false }
# Frozen Exa wire-shape validation (tests/fixtures/exa_schema.json).
# default-features = false: the defaults pull reqwest+rustls for remote
# `$ref` resolution; the fixture is self-contained.
jsonschema = { version = "0.57", default-features = false }
# W2-11 acceptance: validate /opensearch.xml against the vendored
# OpenSearch 1.1 XSD (tests/fixtures/opensearch-1-1.xsd) with a real XSD
# engine. Pure Rust — no libxml2 C dependency in CI.
oxixml-schema = "0.1"
