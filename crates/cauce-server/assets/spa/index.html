    <script>
      // Applies the stored theme before first paint so a saved light/dark
      // choice never flashes the opposite palette (theme_head.html's twin).
      (function () {
        try {
          var t = localStorage.getItem("cauce-theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        } catch (_) {}
      })();
    </script>
    <script type="module" crossorigin src="/app/assets/index-_a_1uX9s.js"></script>
    <link rel="stylesheet" crossorigin href="/app/assets/index-t8Uphyk2.css">

  </body>
