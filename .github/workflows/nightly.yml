name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  validate-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: astral-sh/setup-uv@v5
      - name: Provision ddgs live engine
        run: |
          uv sync --project sdk/python --extra ddgs
          echo "$GITHUB_WORKSPACE/sdk/python/.venv/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        # Keep the nightly release build under target/ so rust-cache covers
        # it; locally it defaults to ~/.cache/cauce/e2e-budget (shared across
        # worktrees) instead of nesting a second dep-graph build in target/.
      - run: mise run validate:nightly
        env:
          CAUCE_BUDGET_TARGET_DIR: target/e2e-budget
