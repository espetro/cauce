# Toolchain and task gate for cauce. One gate: `mise run validate`.
# Install everything: `mise install` (also installs the Rust toolchain).

[tools]
rust = { version = "1.98.0", components = ["rustfmt", "clippy"] }
node = "24.19.0"
pnpm = "11.21.0"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-nextest" = "0.9.146"

[tasks.fmt]
description = "Check formatting with rustfmt"
run = "cargo fmt --all -- --check"

[tasks."fmt:fix"]
description = "Apply rustfmt"
run = "cargo fmt --all"

# CARGO_INCREMENTAL=0 on the gate tasks: gate builds are one-shot (especially
# in short-lived agent worktrees) and incremental artifacts for workspace
# crates just accumulate on disk. Day-to-day `cargo run`/`cargo test`
# iteration keeps incremental on — it is not affected.
[tasks.lint]
description = "Clippy on all targets, warnings as errors"
env = { CARGO_INCREMENTAL = "0" }
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run tests (cargo-nextest when installed, else cargo test)"
env = { CARGO_INCREMENTAL = "0" }
run = """
#!/usr/bin/env bash
set -euo pipefail
threads="$(sysctl -n hw.ncpu 2>/dev/null || nproc 2>/dev/null || echo 4)"
if command -v cargo-nextest >/dev/null 2>&1; then
    cargo nextest run --workspace --test-threads "$threads" --no-tests=pass
    # nextest cannot run doctests; they are part of the gate (CacheKey contract).
    cargo test --workspace --doc
else
    cargo test --workspace -- --test-threads "$threads"
fi
"""

[tasks.deny]
description = "cargo-deny: licenses, advisories, bans, sources"
run = "cargo deny check"

# W1-12: the non-default feature set stays compilable. The default build is
# already covered by lint/test; this checks the minimal agent build
# (`cauce mcp` + `cauce serve --headless`, no ui/ai/otlp). --all-targets also
# compiles the e2e test target under the reduced features.
[tasks."check:features"]
description = "Check cauce-cli --no-default-features --features mcp"
env = { CARGO_INCREMENTAL = "0" }
run = "cargo check -p cauce-cli -p cauce-server --all-targets --no-default-features --features mcp"

# The web bundle is committed (rust-embed reads assets/ at build time), so
# the task rebuilds it and diffs the output — a stale or missing app.js
# fails the gate instead of silently shipping the old script.
[tasks.web]
description = "pnpm install + esbuild bundle + vitest + committed-bundle freshness"
dir = "crates/cauce-server"
run = """
#!/usr/bin/env bash
set -euo pipefail
pnpm install --frozen-lockfile
pnpm run build
pnpm run test
git diff --exit-code -- assets/app.js pnpm-lock.yaml
"""

[tasks.validate]
description = "Full local gate: fmt + lint + test + deny + web + feature-matrix check"
depends = ["fmt", "lint", "test", "deny", "check:features", "web"]

[tasks."validate:nightly"]
description = "Nightly budget, live canary, and full gate"
run = "CAUCE_NIGHTLY=1 CAUCE_LIVE=1 mise run validate"

# W3-08: LOC/complexity report. Non-gating — prints totals, largest
# files/functions and the >1000/>1500/>150 warning thresholds; always
# exits 0. Runs in CI for tracking; not part of `validate`.
[tasks.loc]
description = "Non-gating LOC/complexity report"
run = "bash scripts/loc-report.sh"

[tasks.dev]
description = "Run the cauce binary (cauce serve)"
run = "cargo run -p cauce-cli -- serve"

[tasks."hooks:install"]
description = "Point git at .githooks/ (pre-push runs mise run validate)"
run = "git config core.hooksPath .githooks && echo 'core.hooksPath=.githooks'"
