[tools]
python = "3.12"
bun = "1.2"
uv = "latest"

[tasks.dev]
description = "Run backend server (placeholder until UI skeleton lands)"
run = "uv run oxe"

[tasks."lint:py"]
description = "Ruff lint, empty ignore list (oxe/ + tests/)"
run = "uv run ruff check oxe tests"

[tasks."fmt:py"]
description = "Ruff format check (oxe/ + tests/)"
run = "uv run ruff format --check oxe tests"

[tasks."typecheck:py"]
description = "basedpyright strict"
run = "uv run basedpyright"

[tasks."test:py"]
description = "pytest, ResourceWarning-as-error + pytest-randomly"
run = "uv run pytest"

# `validate` currently runs the Python gates only. The UI half (oxlint, tsc,
# bun test, generator drift checks) lands in a parallel wave-1 pass and will
# be merged into this task then — see
# .agents/plans/2026-09-17-v0.5.0-archive-rebuild.md, "Day-0 gates" #1 and #10.
[tasks.validate]
description = "Fast merge gate (Python-only for now; UI checks land separately)"
depends = ["lint:py", "fmt:py", "typecheck:py", "test:py"]

[tasks."hooks:install"]
description = "Point git at the repo's .githooks directory"
run = "git config core.hooksPath .githooks"
