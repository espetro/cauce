[tools]
python = "3.12"
bun = "1.2"
uv = "latest"

[tasks.dev]
description = "Run backend server (placeholder until UI dev server is wired into a combined task)"
run = "uv run oxe"

[tasks."lint:py"]
description = "Ruff lint, empty ignore list (oxe/ + tests/ + scripts/)"
run = "uv run ruff check oxe tests scripts"

[tasks."fmt:py"]
description = "Ruff format check (oxe/ + tests/ + scripts/)"
run = "uv run ruff format --check oxe tests scripts"

[tasks."typecheck:py"]
description = "basedpyright strict"
run = "uv run basedpyright"

[tasks."test:py"]
description = "pytest, ResourceWarning-as-error + pytest-randomly (includes schemathesis contract tests)"
run = "uv run pytest"

[tasks."gen:openapi"]
description = "Generate openapi.json from the live FastAPI app (oxe.app.create_app)"
run = "uv run python scripts/generate_openapi.py"

[tasks."check:openapi"]
description = "Fail if openapi.json is stale (generator-drift gate, day-0 gate 5)"
run = "uv run python scripts/generate_openapi.py && git diff --exit-code openapi.json"

[tasks."dev:ui"]
description = "Run the UI dev server (Vite)"
dir = "ui"
run = "bun run dev"

[tasks."lint:ui"]
description = "Lint the UI with oxlint (native React Compiler correctness rules)"
dir = "ui"
run = "bun run lint"

[tasks.tsc]
description = "Typecheck the UI (tsc -b, strict + noUncheckedIndexedAccess). Requires codegen (routeTree.gen.ts, compiled Lingui catalog) to already exist — run after build:ui, not standalone on a clean checkout."
dir = "ui"
run = "bunx tsc -b"

[tasks."build:ui"]
description = "Build the UI: extract/compile Lingui catalogs, then vite build, then typecheck"
dir = "ui"
run = "bun run build"

# TS types / Lingui catalog drift checks land alongside the UI half of wave 2
# step 16; validate:full's remaining pieces (size budgets + e2e) land once
# tests/e2e/ is a real runnable suite (wave 3).
[tasks.validate]
description = "Fast merge gate: Python gates + openapi drift + UI lint/build (build:ui runs extract/compile/vite-build/tsc -b as one ordered script)"
depends = ["lint:py", "fmt:py", "typecheck:py", "test:py", "check:openapi", "lint:ui", "build:ui"]

# schemathesis's contract test (tests/test_schemathesis_contract.py) runs as
# part of `test:py` (it is just another pytest file, in-process ASGI, no real
# server) -- so validate:full's own job is to add the checks that are too
# slow or too infrastructure-heavy for the fast gate. e2e (Playwright) is not
# wired here: tests/e2e/ is Wave 1 skip-marked placeholder .md files today,
# not a runnable suite; it lands in Wave 3 per the plan.
[tasks."validate:full"]
description = "Full merge gate: validate, plus anything slow/heavy (e2e lands in Wave 3, not wired here yet)"
depends = ["validate"]

[tasks."hooks:install"]
description = "Point git at the repo's .githooks directory"
run = "git config core.hooksPath .githooks"
