[tools]
python = "3.12"
bun = "1.2"
uv = "latest"

[tasks.dev]
description = "Run backend server (placeholder until UI dev server is wired into a combined task)"
run = "uv run oxe"

[tasks."lint:py"]
description = "Ruff lint, empty ignore list (oxe/ + tests/)"
run = "uv run ruff check oxe tests"

[tasks."fmt:py"]
description = "Ruff format check (oxe/ + tests/)"
run = "uv run ruff format --check oxe tests"

[tasks."typecheck:py"]
description = "basedpyright strict"
run = "uv run basedpyright"

[tasks."test:py"]
description = "pytest, ResourceWarning-as-error + pytest-randomly"
run = "uv run pytest"

[tasks."dev:ui"]
description = "Run the UI dev server (Vite)"
dir = "ui"
run = "bun run dev"

[tasks."lint:ui"]
description = "Lint the UI with oxlint (native React Compiler correctness rules)"
dir = "ui"
run = "bun run lint"

[tasks.tsc]
description = "Typecheck the UI (tsc -b, strict + noUncheckedIndexedAccess). Requires codegen (routeTree.gen.ts, compiled Lingui catalog) to already exist — run after build:ui, not standalone on a clean checkout."
dir = "ui"
run = "bunx tsc -b"

[tasks."build:ui"]
description = "Build the UI: extract/compile Lingui catalogs, then vite build, then typecheck"
dir = "ui"
run = "bun run build"

# generator drift checks (openapi/types/catalogs) land in wave 2; validate:full
# (build + size budgets + schemathesis + e2e) lands once those exist.
[tasks.validate]
description = "Fast merge gate: Python gates + UI lint/build (build:ui runs extract/compile/vite-build/tsc -b as one ordered script)"
depends = ["lint:py", "fmt:py", "typecheck:py", "test:py", "lint:ui", "build:ui"]

[tasks."hooks:install"]
description = "Point git at the repo's .githooks directory"
run = "git config core.hooksPath .githooks"
