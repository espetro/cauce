[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxe"
version = "0.1.2"
description = "Local web-search proxy and cache for AI agents. Exa-compatible HTTP API + MCP, DuckDuckGo backend, SQLite TTL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "espetro" }]
keywords = [
    "duckduckgo",
    "duckduckgo-search",
    "exa",
    "exa-search",
    "mcp",
    "model-context-protocol",
    "web-search",
    "search-api",
    "cache",
    "proxy",
    "ai-agents",
    "llm-tools",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/espetro/oxe"
Repository = "https://github.com/espetro/oxe"
Issues = "https://github.com/espetro/oxe/issues"

[project.scripts]
oxe = "oxe.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oxe*"]

[tool.setuptools.package-data]
oxe = ["static/*"]
