[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxe"
version = "0.4.0"
description = "Local web-search proxy and cache for AI agents. Exa-compatible HTTP API + MCP, DuckDuckGo backend, SQLite TTL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Quino Terrasa" }]
keywords = [
    "duckduckgo",
    "duckduckgo-search",
    "exa",
    "exa-search",
    "mcp",
    "model-context-protocol",
    "web-search",
    "search-api",
    "cache",
    "proxy",
    "ai-agents",
    "llm-tools",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "mcp>=2.0",
    "aiosql>=15.0",
]

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.14.5"]
ai = ["aisuite[openai,anthropic]~=0.1.14"]

[project.urls]
Homepage = "https://github.com/espetro/oxe"
Repository = "https://github.com/espetro/oxe"
Issues = "https://github.com/espetro/oxe/issues"

[project.scripts]
oxe = "oxe.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oxe*"]

[tool.setuptools.package-data]
oxe = ["sql/*.sql", "ui_dist/*", "ui_dist/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "RUF", "C4", "UP", "BLE", "TRY"]
ignore = [
    "UP045", # Optional[X] -> X | None churn in pre-existing code
    "UP035",
    "BLE001", # broad except at API boundaries is intentional
    "TRY003", # long exception messages in HTTP handlers are fine here
    "TRY401",
    "B904",
    "C408",
    "RUF012",
    "RUF022",
    "SIM102",
    "SIM105",
    "SIM108",
    "E741",
    "B905",
    "TRY300",
    "C416",
    "E402",
]
