[project]
name = "oxe-engine-sdk"
version = "0.0.0"
description = "oxe exec engine protocol SDK (JSON lines over stdio, v1) and the ddgs reference engine"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Joaquin Terrasa and oxe contributors" }]
# Zero runtime dependencies on purpose: the SDK must run under a bare python3.
dependencies = []

[project.optional-dependencies]
# Reference engine only; install with `uv sync --extra ddgs` or `uv run --extra ddgs`.
ddgs = ["ddgs>=9"]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package is sdk/python/oxe_engine_sdk, not src/oxe_engine_sdk.
module-root = ""
